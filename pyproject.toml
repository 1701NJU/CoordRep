[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "coordrep"
version = "1.1.2rc3"
description = "A Canonical, Continuous, and Compositional Representation for Coordination Chemistry"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
authors = [
    {name = "Wen-Lin Luo", email = "luowenlin862@gmail.com"},
    {name = "Cheng-Hui Li"},
]
keywords = ["coordination chemistry", "canonicalization", "CShM", "machine learning", "representation"]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "networkx>=2.8",
    "pandas>=2.0",
    "tqdm>=4.65",
]

[project.optional-dependencies]
ml = ["torch>=2.0", "torch_geometric>=2.3", "scikit-learn>=1.2"]
chem = ["rdkit>=2023.03", "gemmi>=0.6.4"]
csd = ["ccdc"]
dev = ["pytest>=7.0", "pytest-cov>=4.0"]
all = ["torch>=2.0", "torch_geometric>=2.3", "scikit-learn>=1.2", "rdkit>=2023.03", "gemmi>=0.6.4", "pytest>=7.0", "pytest-cov>=4.0"]

[project.urls]
Homepage = "https://github.com/1701NJU/CoordRep"
Documentation = "https://github.com/1701NJU/CoordRep#readme"
Repository = "https://github.com/1701NJU/CoordRep.git"

[tool.setuptools.packages.find]
where = ["release/jacs-revision-20260823"]
include = ["coordrep*", "brain*", "coordrep_tools*"]

[tool.pytest.ini_options]
testpaths = ["release/jacs-revision-20260823/tests"]
python_files = ["test_*.py"]
addopts = "-v --tb=short --ignore=release/jacs-revision-20260823/tests/test_invariance.py"
