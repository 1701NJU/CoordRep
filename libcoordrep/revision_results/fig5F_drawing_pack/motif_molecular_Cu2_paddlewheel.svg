<svg xmlns="http://www.w3.org/2000/svg" width="280" height="200" viewBox="0 0 280 200">
  <!-- Molecular Cu2 paddlewheel motif (ACACCV10) -->
  <!-- White background -->
  <rect width="280" height="200" fill="white"/>

  <!-- Cu atoms -->
  <circle cx="110" cy="100" r="14" fill="#D97706" stroke="#92400E" stroke-width="1.5"/>
  <text x="110" y="105" text-anchor="middle" font-size="11" font-family="Arial" fill="white" font-weight="bold">Cu</text>
  <circle cx="170" cy="100" r="14" fill="#D97706" stroke="#92400E" stroke-width="1.5"/>
  <text x="170" y="105" text-anchor="middle" font-size="11" font-family="Arial" fill="white" font-weight="bold">Cu</text>

  <!-- Cu-Cu bond -->
  <line x1="124" y1="100" x2="156" y2="100" stroke="#92400E" stroke-width="2" stroke-dasharray="4,2"/>

  <!-- Bridging carboxylate O atoms (4 bridges = 8 O) -->
  <!-- Top bridge -->
  <circle cx="140" cy="50" r="8" fill="#EF4444" stroke="#B91C1C" stroke-width="1"/>
  <text x="140" y="54" text-anchor="middle" font-size="9" font-family="Arial" fill="white">O</text>
  <line x1="118" y1="88" x2="135" y2="56" stroke="#6B7280" stroke-width="1.2"/>
  <line x1="162" y1="88" x2="145" y2="56" stroke="#6B7280" stroke-width="1.2"/>

  <!-- Bottom bridge -->
  <circle cx="140" cy="150" r="8" fill="#EF4444" stroke="#B91C1C" stroke-width="1"/>
  <text x="140" y="154" text-anchor="middle" font-size="9" font-family="Arial" fill="white">O</text>
  <line x1="118" y1="112" x2="135" y2="144" stroke="#6B7280" stroke-width="1.2"/>
  <line x1="162" y1="112" x2="145" y2="144" stroke="#6B7280" stroke-width="1.2"/>

  <!-- Left bridge -->
  <circle cx="80" cy="75" r="8" fill="#EF4444" stroke="#B91C1C" stroke-width="1"/>
  <text x="80" y="79" text-anchor="middle" font-size="9" font-family="Arial" fill="white">O</text>
  <line x1="100" y1="92" x2="86" y2="80" stroke="#6B7280" stroke-width="1.2"/>
  <circle cx="80" cy="125" r="8" fill="#EF4444" stroke="#B91C1C" stroke-width="1"/>
  <text x="80" y="129" text-anchor="middle" font-size="9" font-family="Arial" fill="white">O</text>
  <line x1="100" y1="108" x2="86" y2="120" stroke="#6B7280" stroke-width="1.2"/>

  <!-- Right bridge -->
  <circle cx="200" cy="75" r="8" fill="#EF4444" stroke="#B91C1C" stroke-width="1"/>
  <text x="200" y="79" text-anchor="middle" font-size="9" font-family="Arial" fill="white">O</text>
  <line x1="180" y1="92" x2="194" y2="80" stroke="#6B7280" stroke-width="1.2"/>
  <circle cx="200" cy="125" r="8" fill="#EF4444" stroke="#B91C1C" stroke-width="1"/>
  <text x="200" y="129" text-anchor="middle" font-size="9" font-family="Arial" fill="white">O</text>
  <line x1="180" y1="108" x2="194" y2="120" stroke="#6B7280" stroke-width="1.2"/>

  <!-- Apical O (axial) -->
  <circle cx="60" cy="100" r="7" fill="#93C5FD" stroke="#3B82F6" stroke-width="1"/>
  <text x="60" y="104" text-anchor="middle" font-size="8" font-family="Arial" fill="#1E40AF">O</text>
  <line x1="96" y1="100" x2="67" y2="100" stroke="#6B7280" stroke-width="1"/>
  <circle cx="220" cy="100" r="7" fill="#93C5FD" stroke="#3B82F6" stroke-width="1"/>
  <text x="220" y="104" text-anchor="middle" font-size="8" font-family="Arial" fill="#1E40AF">O</text>
  <line x1="184" y1="100" x2="213" y2="100" stroke="#6B7280" stroke-width="1"/>

  <!-- Label -->
  <text x="140" y="188" text-anchor="middle" font-size="10" font-family="Arial" fill="#374151">Molecular Cu₂(O₂CR)₄ (ACACCV10)</text>

  <!-- mu2 annotation -->
  <text x="140" y="30" text-anchor="middle" font-size="8" font-family="Arial" fill="#6B7280">μ₂-O bridging</text>
</svg>
