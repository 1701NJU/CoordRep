[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "coordrep"
version = "1.1.0"
description = "A canonical, continuous, and compositional representation for coordination chemistry"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
authors = [
    {name = "Cheng-Hui Li"},
    {name = "Wen-Lin Luo", email = "luowenlin862@gmail.com"},
]
keywords = ["coordination chemistry", "machine learning", "representation", "tokenizer", "identity"]

[project.urls]
Homepage = "https://github.com/1701NJU/CoordRep"
Documentation = "https://github.com/1701NJU/CoordRep#readme"
Repository = "https://github.com/1701NJU/CoordRep.git"
Issues = "https://github.com/1701NJU/CoordRep/issues"

[project.optional-dependencies]
ml = ["torch>=2.0", "torch_geometric>=2.3"]
csd = ["ccdc"]
dev = ["pytest>=7.0", "pytest-cov"]

[tool.setuptools.packages.find]
include = ["coordrep*", "coordrep_tools*", "brain*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --tb=short --ignore=tests/test_invariance.py"
