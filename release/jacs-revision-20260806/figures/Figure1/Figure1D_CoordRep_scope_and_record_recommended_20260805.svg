<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="65mm" height="92mm" viewBox="0 0 650 920">
  <title>Recommended Figure 1D: one record language across coordination objects</title>
  <desc>A complete HUTHIP CoordRep-State followed by representative chelating, bridging multimetal, haptic, and periodic coordination objects.</desc>
  <defs>
    <style>
      .sans { font-family: Arial, Helvetica, sans-serif; fill: #20252b; }
      .title { font-size: 25px; font-weight: 700; }
      .subtitle { font-size: 16px; fill: #5b6470; }
      .section { font-size: 17px; font-weight: 700; }
      .record { font-size: 16.5px; }
      .tiletitle { font-size: 17px; font-weight: 700; }
      .tiletext { font-size: 16px; }
      .atomlabel { font-size: 15px; font-weight: 700; }
      .bond { stroke: #46505a; stroke-width: 3; stroke-linecap: round; }
      .fine { stroke: #87909a; stroke-width: 1.5; fill: none; }
    </style>
  </defs>

  <rect x="8" y="8" width="634" height="904" rx="14" fill="#ffffff" stroke="#2f343a" stroke-width="2" stroke-dasharray="8 6"/>
  <text x="28" y="45" class="sans title">(d) Complete record and coordination scope</text>
  <text x="28" y="70" class="sans subtitle">One CoordRep framework from molecular complexes to periodic first spheres</text>

  <!-- Complete molecular-core example -->
  <g class="sans">
    <rect x="28" y="84" width="594" height="43" rx="8" fill="#f6f8fa" stroke="#c7cdd4" stroke-width="1.2"/>
    <g transform="translate(55,105)">
      <line x1="0" y1="-14" x2="0" y2="14" class="bond"/>
      <line x1="-14" y1="0" x2="14" y2="0" class="bond"/>
      <circle cx="0" cy="0" r="10" fill="#1f4e79"/>
      <text x="0" y="5" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="700" fill="#ffffff">Pt</text>
      <circle cx="0" cy="-17" r="5" fill="#ffffff" stroke="#356fa1" stroke-width="1.5"/>
      <circle cx="0" cy="17" r="5" fill="#ffffff" stroke="#356fa1" stroke-width="1.5"/>
      <circle cx="-17" cy="0" r="5" fill="#ffffff" stroke="#356fa1" stroke-width="1.5"/>
      <circle cx="17" cy="0" r="5" fill="#ffffff" stroke="#356fa1" stroke-width="1.5"/>
    </g>
    <text x="90" y="111" class="section" fill="#1f4e79">HUTHIP · mononuclear PtN₄ · complete CoordRep-State</text>

    <rect x="28" y="135" width="594" height="58" rx="7" fill="#e8f1f8" stroke="#1f4e79" stroke-width="1.3"/>
    <rect x="28" y="135" width="7" height="58" rx="3.5" fill="#1f4e79"/>
    <text x="48" y="157" class="section" fill="#1f4e79">Metal context</text>
    <text x="48" y="183" class="record">[Metal:Pt|ox:+2|d:d8|CN:4]</text>

    <rect x="28" y="201" width="594" height="70" rx="7" fill="#e7f5f2" stroke="#2a9d8f" stroke-width="1.3"/>
    <rect x="28" y="201" width="7" height="70" rx="3.5" fill="#2a9d8f"/>
    <text x="48" y="223" class="section" fill="#237e73">Continuous geometry</text>
    <text x="48" y="248" class="record">&lt;ShapeBest:SP|Class:ideal|Delta:3|</text>
    <text x="48" y="267" class="record">V:33.35,0.03&gt;</text>

    <rect x="28" y="279" width="594" height="111" rx="7" fill="#fff3e4" stroke="#d97706" stroke-width="1.3"/>
    <rect x="28" y="279" width="7" height="111" rx="3.5" fill="#d97706"/>
    <text x="48" y="301" class="section" fill="#b65d05">Donor-site relations</text>
    <text x="48" y="326" class="record">{trans:L1:N:1--L2:N:1}{trans:L3:N:1--L4:N:1}</text>
    <text x="48" y="350" class="record">{cis:L1:N:1--L3:N:1}{cis:L1:N:1--L4:N:1}</text>
    <text x="48" y="374" class="record">{cis:L2:N:1--L3:N:1}{cis:L2:N:1--L4:N:1}</text>

    <rect x="28" y="398" width="594" height="82" rx="7" fill="#f2eef5" stroke="#6c5b7b" stroke-width="1.3"/>
    <rect x="28" y="398" width="7" height="82" rx="3.5" fill="#6c5b7b"/>
    <text x="48" y="420" class="section" fill="#6c5b7b">Ligand modules</text>
    <text x="48" y="445" class="record">|L1=FORMULA:C6H7N|L2=FORMULA:C6H7N</text>
    <text x="48" y="469" class="record">|L3=FORMULA:C8H10N3O2|L4=FORMULA:C8H10N3O2|</text>
  </g>

  <line x1="28" y1="498" x2="622" y2="498" stroke="#c5cbd2" stroke-width="1.4"/>
  <text x="325" y="520" text-anchor="middle" class="sans section" fill="#38424d">CoordRep objects across coordination regimes</text>

  <!-- Chelating coordination tile -->
  <g class="sans">
    <rect x="28" y="533" width="287" height="157" rx="9" fill="#f8fbfc" stroke="#2a9d8f" stroke-width="1.5"/>
    <text x="43" y="557" class="tiletitle" fill="#237e73">Chelating ligand</text>
    <text x="43" y="581" class="tiletext">ATIZEK · three κ²-N,O chelates</text>
    <circle cx="171" cy="633" r="19" fill="#2a9d8f"/>
    <text x="171" y="639" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#ffffff">M</text>
    <g stroke="#46505a" stroke-width="2.2" fill="#ffffff">
      <line x1="157" y1="620" x2="128" y2="600"/><line x1="185" y1="620" x2="214" y2="600"/>
      <line x1="154" y1="638" x2="119" y2="647"/><line x1="188" y1="638" x2="223" y2="647"/>
      <line x1="162" y1="649" x2="149" y2="674"/><line x1="180" y1="649" x2="193" y2="674"/>
      <circle cx="128" cy="600" r="9"/><circle cx="214" cy="600" r="9"/>
      <circle cx="119" cy="647" r="9"/><circle cx="223" cy="647" r="9"/>
      <circle cx="149" cy="674" r="9"/><circle cx="193" cy="674" r="9"/>
      <path d="M128,590 Q171,566 214,590" class="fine" stroke="#6c5b7b"/>
      <path d="M109,647 Q104,682 145,682" class="fine" stroke="#6c5b7b"/>
      <path d="M197,682 Q238,682 233,647" class="fine" stroke="#6c5b7b"/>
    </g>
    <g class="atomlabel" font-family="Arial, Helvetica, sans-serif" text-anchor="middle">
      <text x="128" y="605" fill="#1f4e79">N</text><text x="214" y="605" fill="#b65d05">O</text>
      <text x="119" y="652" fill="#1f4e79">N</text><text x="223" y="652" fill="#b65d05">O</text>
      <text x="149" y="679" fill="#1f4e79">N</text><text x="193" y="679" fill="#b65d05">O</text>
    </g>
  </g>

  <!-- Bridged multimetal tile -->
  <g class="sans">
    <rect x="335" y="533" width="287" height="157" rx="9" fill="#fffaf2" stroke="#d59a17" stroke-width="1.5"/>
    <text x="350" y="557" class="tiletitle" fill="#a66e00">Shared donor sites</text>
    <text x="350" y="581" class="tiletext">VOBZER · Cu₂ · two sites</text>
    <circle cx="415" cy="637" r="20" fill="#c97c22"/>
    <circle cx="542" cy="637" r="20" fill="#c97c22"/>
    <text x="415" y="643" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#ffffff">Cu</text>
    <text x="542" y="643" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#ffffff">Cu</text>
    <circle cx="479" cy="607" r="10" fill="#ffffff" stroke="#6c5b7b" stroke-width="2"/>
    <circle cx="479" cy="667" r="10" fill="#ffffff" stroke="#6c5b7b" stroke-width="2"/>
    <line x1="432" y1="628" x2="469" y2="611" class="bond"/><line x1="489" y1="611" x2="525" y2="628" class="bond"/>
    <line x1="432" y1="646" x2="469" y2="663" class="bond"/><line x1="489" y1="663" x2="525" y2="646" class="bond"/>
    <text x="479" y="611" text-anchor="middle" class="atomlabel" fill="#6c5b7b">μ</text>
    <text x="479" y="671" text-anchor="middle" class="atomlabel" fill="#6c5b7b">μ</text>
  </g>

  <!-- Haptic coordination tile -->
  <g class="sans">
    <rect x="28" y="703" width="287" height="165" rx="9" fill="#faf8fc" stroke="#6c5b7b" stroke-width="1.5"/>
    <text x="43" y="727" class="tiletitle" fill="#6c5b7b">Haptic coordination</text>
    <text x="43" y="751" class="tiletext">POXVEH · Fe · two η⁵ site objects</text>
    <polygon points="171,767 196,785 186,814 156,814 146,785" fill="#f2eef5" stroke="#6c5b7b" stroke-width="2"/>
    <polygon points="171,846 196,828 186,799 156,799 146,828" fill="#f2eef5" stroke="#6c5b7b" stroke-width="2"/>
    <circle cx="171" cy="807" r="18" fill="#aa5b3f" stroke="#87422c" stroke-width="1.5"/>
    <text x="171" y="813" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#ffffff">Fe</text>
    <line x1="171" y1="789" x2="171" y2="781" stroke="#46505a" stroke-width="2"/>
    <line x1="171" y1="825" x2="171" y2="833" stroke="#46505a" stroke-width="2"/>
    <text x="212" y="790" class="atomlabel" fill="#6c5b7b">η⁵ site</text>
    <text x="212" y="835" class="atomlabel" fill="#6c5b7b">η⁵ site</text>
  </g>

  <!-- Periodic first-sphere tile -->
  <g class="sans">
    <rect x="335" y="703" width="287" height="165" rx="9" fill="#f5fbf7" stroke="#3b8e5a" stroke-width="1.5"/>
    <text x="350" y="727" class="tiletitle" fill="#2f7c4d">Periodic first sphere</text>
    <text x="350" y="751" class="tiletext">XUMMID · CuN₄Cl₂ · τ edge</text>
    <line x1="352" y1="780" x2="605" y2="780" stroke="#d97706" stroke-width="2" stroke-dasharray="7 5"/>
    <text x="601" y="775" text-anchor="end" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#b65d05">cell boundary</text>
    <circle cx="479" cy="824" r="18" fill="#c97c22"/>
    <text x="479" y="830" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#ffffff">Cu</text>
    <circle cx="479" cy="772" r="11" fill="#3b8e5a"/>
    <text x="479" y="777" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#ffffff">Cl</text>
    <circle cx="479" cy="857" r="10" fill="#3b8e5a"/>
    <text x="479" y="862" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" fill="#ffffff">Cl</text>
    <line x1="479" y1="806" x2="479" y2="783" class="bond"/>
    <line x1="479" y1="842" x2="479" y2="847" class="bond"/>
    <circle cx="447" cy="807" r="7" fill="#ffffff" stroke="#356fa1" stroke-width="2"/>
    <circle cx="511" cy="807" r="7" fill="#ffffff" stroke="#356fa1" stroke-width="2"/>
    <circle cx="447" cy="841" r="7" fill="#ffffff" stroke="#356fa1" stroke-width="2"/>
    <circle cx="511" cy="841" r="7" fill="#ffffff" stroke="#356fa1" stroke-width="2"/>
    <line x1="463" y1="815" x2="453" y2="810" class="bond"/>
    <line x1="495" y1="815" x2="505" y2="810" class="bond"/>
    <line x1="463" y1="833" x2="453" y2="838" class="bond"/>
    <line x1="495" y1="833" x2="505" y2="838" class="bond"/>
    <text x="512" y="797" class="atomlabel" fill="#b65d05">τ = (0,0,1)</text>
  </g>

  <text x="325" y="895" text-anchor="middle" class="sans subtitle">molecular core · record graphs · coordination-site objects · periodic quotient</text>
</svg>
