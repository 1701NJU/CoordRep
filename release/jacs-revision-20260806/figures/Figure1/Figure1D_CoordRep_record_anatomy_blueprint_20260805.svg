<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="65mm" height="92mm" viewBox="0 0 650 920">
  <title>Figure 1D blueprint: anatomy of a complete CoordRep-State</title>
  <desc>A portrait panel showing the HUTHIP square-planar PtN4 first coordination sphere above four color-coded blocks of the complete CoordRep record.</desc>
  <defs>
    <style>
      .sans { font-family: Arial, Helvetica, sans-serif; fill: #20252b; }
      .title { font-size: 28px; font-weight: 700; }
      .sub { font-size: 17px; fill: #5b6470; }
      .label { font-size: 18px; font-weight: 700; }
      .record { font-size: 17px; }
      .small { font-size: 16px; }
      .bond { stroke: #3f4650; stroke-width: 5; stroke-linecap: round; }
      .thin { stroke: #7b8490; stroke-width: 1.6; fill: none; }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#69727d"/>
    </marker>
  </defs>

  <rect x="8" y="8" width="634" height="904" rx="14" fill="#ffffff" stroke="#2f343a" stroke-width="2" stroke-dasharray="8 6"/>
  <text x="28" y="48" class="sans title">(d) Anatomy of a complete CoordRep-State</text>
  <text x="28" y="73" class="sans sub">HUTHIP · Pt(II), CN = 4 · square-planar first coordination sphere</text>

  <!-- Chemistry-first first-sphere view -->
  <polygon points="215,105 315,205 215,305 115,205" fill="#e7f5f2" stroke="#2a9d8f" stroke-width="2"/>
  <line x1="215" y1="205" x2="215" y2="118" class="bond"/>
  <line x1="215" y1="205" x2="215" y2="292" class="bond"/>
  <line x1="215" y1="205" x2="128" y2="205" class="bond"/>
  <line x1="215" y1="205" x2="302" y2="205" class="bond"/>

  <circle cx="215" cy="205" r="31" fill="#1f4e79" stroke="#183b5d" stroke-width="2"/>
  <text x="215" y="213" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" fill="#ffffff">Pt</text>

  <g font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" text-anchor="middle">
    <circle cx="215" cy="105" r="21" fill="#ffffff" stroke="#356fa1" stroke-width="3"/>
    <text x="215" y="112" fill="#1f4e79">N</text>
    <circle cx="215" cy="305" r="21" fill="#ffffff" stroke="#356fa1" stroke-width="3"/>
    <text x="215" y="312" fill="#1f4e79">N</text>
    <circle cx="115" cy="205" r="21" fill="#ffffff" stroke="#356fa1" stroke-width="3"/>
    <text x="115" y="212" fill="#1f4e79">N</text>
    <circle cx="315" cy="205" r="21" fill="#ffffff" stroke="#356fa1" stroke-width="3"/>
    <text x="315" y="212" fill="#1f4e79">N</text>
  </g>

  <g class="sans small" font-weight="700" fill="#6c5b7b">
    <text x="251" y="112">L1:N:1</text>
    <text x="251" y="314">L2:N:1</text>
    <text x="115" y="170" text-anchor="middle">L3:N:1</text>
    <text x="315" y="170" text-anchor="middle">L4:N:1</text>
  </g>

  <g class="sans">
    <rect x="394" y="103" width="220" height="42" rx="7" fill="#e8f1f8"/>
    <rect x="394" y="153" width="220" height="42" rx="7" fill="#e7f5f2"/>
    <rect x="394" y="203" width="220" height="54" rx="7" fill="#fff3e4"/>
    <rect x="394" y="265" width="220" height="42" rx="7" fill="#f2eef5"/>
    <text x="408" y="130" class="label" fill="#1f4e79">Pt(II), d8, CN = 4</text>
    <text x="408" y="180" class="label" fill="#237e73">SP; S(SP) = 0.03</text>
    <text x="408" y="226" class="small" font-weight="700" fill="#b65d05">trans: L1-L2; L3-L4</text>
    <text x="408" y="248" class="small" fill="#b65d05">four adjacent cis pairs</text>
    <text x="408" y="292" class="label" fill="#6c5b7b">four ligand modules</text>
  </g>

  <text x="325" y="354" text-anchor="middle" class="sans small" fill="#5b6470">coordination snapshot</text>
  <line x1="325" y1="360" x2="325" y2="378" stroke="#69727d" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Complete record, line-broken only between fields -->
  <g class="sans">
    <rect x="28" y="386" width="594" height="72" rx="8" fill="#e8f1f8" stroke="#1f4e79" stroke-width="1.5"/>
    <rect x="28" y="386" width="8" height="72" rx="4" fill="#1f4e79"/>
    <text x="50" y="409" class="label" fill="#1f4e79">Metal context</text>
    <text x="50" y="440" class="record">[Metal:Pt|ox:+2|d:d8|CN:4]</text>

    <rect x="28" y="468" width="594" height="84" rx="8" fill="#e7f5f2" stroke="#2a9d8f" stroke-width="1.5"/>
    <rect x="28" y="468" width="8" height="84" rx="4" fill="#2a9d8f"/>
    <text x="50" y="491" class="label" fill="#237e73">Continuous geometry</text>
    <text x="50" y="523" class="record">&lt;ShapeBest:SP|Class:ideal|Delta:3|</text>
    <text x="50" y="544" class="record">V:33.35,0.03&gt;</text>

    <rect x="28" y="562" width="594" height="158" rx="8" fill="#fff3e4" stroke="#d97706" stroke-width="1.5"/>
    <rect x="28" y="562" width="8" height="158" rx="4" fill="#d97706"/>
    <text x="50" y="585" class="label" fill="#b65d05">Donor-site relations</text>
    <text x="50" y="614" class="record">{trans:L1:N:1--L2:N:1}</text>
    <text x="50" y="636" class="record">{trans:L3:N:1--L4:N:1}</text>
    <text x="50" y="658" class="record">{cis:L1:N:1--L3:N:1}{cis:L1:N:1--L4:N:1}</text>
    <text x="50" y="680" class="record">{cis:L2:N:1--L3:N:1}{cis:L2:N:1--L4:N:1}</text>

    <rect x="28" y="730" width="594" height="146" rx="8" fill="#f2eef5" stroke="#6c5b7b" stroke-width="1.5"/>
    <rect x="28" y="730" width="8" height="146" rx="4" fill="#6c5b7b"/>
    <text x="50" y="753" class="label" fill="#6c5b7b">Ligand modules</text>
    <text x="50" y="778" class="record">|L1=FORMULA:C6H7N</text>
    <text x="50" y="801" class="record">|L2=FORMULA:C6H7N</text>
    <text x="50" y="824" class="record">|L3=FORMULA:C8H10N3O2</text>
    <text x="50" y="847" class="record">|L4=FORMULA:C8H10N3O2|</text>
  </g>

  <text x="325" y="899" text-anchor="middle" class="sans small" fill="#5b6470">Complete record; line breaks added only for readability.</text>
</svg>
